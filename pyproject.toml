[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zigbeendicate-sounds"
version = "0.2.0"
description = "Gamepad-driven Zigbee light controller with audio sync, MCP server, and REST API"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    # Core — gamepad + Zigbee
    "evdev>=1.9.2",
    "paho-mqtt>=2.1.0",

    # Audio analysis (Track 1)
    "numpy>=1.26",
    "pyaudio>=0.2.14",
    "librosa>=0.10",          # beat tracking (optional but powerful)

    # MCP server (Track 2)
    "mcp>=1.0",
    "fastmcp>=0.4",

    # REST / WebSocket API (Track 3)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
zigbee-mcp     = "mcp_zigbee_server:main"
zigbee-api     = "api_server:main"
zigbee-audio   = "audio_analyzer:main"
zigbee-gamepad = "gamepad_light_controller:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
